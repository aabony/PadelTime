# Deploys the Worker (code + static assets + lazy D1 columns) with wrangler.
# Needs two repository secrets: CLOUDFLARE_API_TOKEN (Workers Scripts: Edit,
# Workers Assets, D1: Edit) and CLOUDFLARE_ACCOUNT_ID. Runs on every push to
# main and on demand from the Actions tab.
name: Deploy

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: deploy
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run check
      - run: npm test
      - run: npm run deploy
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
